<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paknaan Lost-Link is the official lost and found system for Barangay Paknaan. Residents can report lost items, browse found item postings, submit claims, and track returns — all in one verified workflow with barangay staff." />
    <link rel="icon" type="image/png" href="/src/assets/lostlink-logo-cropped.png" />
    <title>Paknaan Lost-Link — Barangay Lost & Found System</title>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
